set -g base-index 1
set -g default-terminal screen-256color
set -g history-limit 999999
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string "#W"
set -g status-bg black
set -g status-fg green
set -g status-justify centre
set -g status-keys emacs
set -g status-left '#{?#{@prefix-switch-count},#{@prefix-switch-count}-,}#(ischroot && cat /etc/hostname || hostname)'
set -g status-right "#(status.sh)"
set -g status-right-length 60
setw -g mode-keys vi
setw -g monitor-activity on
setw -g window-status-current-format "[#I:#T:#W#F]"
setw -g window-status-format "[#I:#T:#W#F]"
setw -g pane-base-index 1
setw -g window-status-style dim
setw -g window-status-current-style bright
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -vc '#{pane_current_path}'
bind '%' split-window -hc '#{pane_current_path}'
bind C-l send-keys 'C-l'

# Bind pane navigation keys for innerost session (by running command).
is_nested='echo "#{pane_current_command}" | grep -qE "(^|\/)(ssh|tmux)$"'
semicolon=\;
quote="'"
bind -n M-space if-shell "$is_nested" "send-keys M-space" "select-window -l"
bind -n M-\; if-shell "$is_nested" "send-keys M-\$semicolon" "select-window -n"
bind -n M-: if-shell "$is_nested" "send-keys M-\:" "select-window -p"
bind -n "M-'" if-shell "$is_nested" "send-keys \"M-\$quote\"" "new-window -c '#{pane_current_path}'"
bind -n M-H if-shell "$is_nested" "send-keys M-H" "select-pane -L"
bind -n M-J if-shell "$is_nested" "send-keys M-J" "select-pane -D"
bind -n M-K if-shell "$is_nested" "send-keys M-K" "select-pane -U"
bind -n M-L if-shell "$is_nested" "send-keys M-L" "select-pane -R"
bind -n M-I if-shell "$is_nested" "send-keys M-[" "copy-mode"

# Switch leader key on a session (helps with nested sessions).
set -g @prefix-switch-count 0
bind -n M-Up if-shell -F '#{@prefix-switch-count}' {
    send-keys M-Up
    set -F @prefix-switch-count "#{e|+|:#{@prefix-switch-count},1}"
} {
    set @prefix-switch-count 1
    set prefix m-a
    set status-style strikethrough
}
bind -n M-Down if-shell -F '#{@prefix-switch-count}' {
    if-shell -F '#{==:#{@prefix-switch-count},1}' {
        set @prefix-switch-count 0
        set prefix C-b
        set status-style ""
    } {
        set -F @prefix-switch-count "#{e|-|:#{@prefix-switch-count},1}"
        send-keys M-Down
    }
} {
    send-keys M-Down
}
bind -n M-Left if-shell -F '#{@prefix-switch-count}' { send-keys M-Left } { select-window -p }
bind -n M-Right if-shell -F '#{@prefix-switch-count}' { send-keys M-Right } { select-window -n }

run-shell ~/bin/extrakto/extrakto.tmux
